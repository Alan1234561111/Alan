<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<title>霓虹疾航 NEON RUSH</title>
<style>
:root{--c1:#ff2bd6;--c2:#19e6ff;--c3:#ffe45e;--bg:#05010d;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC","Source Han Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:#fff;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>div{position:absolute}
.lbl{font-size:clamp(10px,1.5vmin,13px);letter-spacing:.3em;color:#9fe9ff;opacity:.85;text-shadow:0 0 8px #19e6ff}
.tl{left:calc(16px + var(--sal));top:calc(12px + var(--sat))}
#score{font-size:clamp(30px,6vmin,56px);font-weight:900;font-style:italic;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 6px #fff,0 0 18px var(--c2),0 0 36px var(--c2)}
.best{font-size:clamp(11px,1.7vmin,14px);color:#ffb6f0;margin-top:4px;text-shadow:0 0 8px var(--c1);letter-spacing:.08em}
.tc{left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);text-align:center;min-width:160px}
#comboBox{transition:opacity .25s,transform .15s;opacity:0}
#comboBox.on{opacity:1}
#mult{display:block;font-size:clamp(26px,5vmin,46px);font-weight:900;font-style:italic;color:var(--c3);text-shadow:0 0 6px #fff,0 0 20px #ff9d00,0 0 40px #ff5e00;line-height:1}
#mult.bump{animation:pop .22s ease-out}
#comboTxt{font-size:clamp(11px,1.8vmin,15px);letter-spacing:.2em;color:#ffe9a8;text-shadow:0 0 8px #ff9d00}
.bar{width:min(160px,34vw);height:5px;margin:5px auto 0;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;box-shadow:0 0 8px rgba(255,200,0,.3)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9d00,#ffe45e);transform-origin:left;box-shadow:0 0 10px #ffb400}
.bl{left:calc(16px + var(--sal));bottom:calc(14px + var(--sab))}
#speed{display:inline-block;font-size:clamp(20px,3.6vmin,32px);font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;text-shadow:0 0 10px var(--c1)}
.unit{font-size:12px;opacity:.7;margin-left:4px}
#lvl{margin-top:2px;font-size:clamp(11px,1.7vmin,14px);color:#c8b8ff;letter-spacing:.12em}
.bc{left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end}
.chip{position:relative;min-width:84px;padding:6px 10px 8px;border-radius:10px;background:rgba(10,4,30,.62);border:1px solid var(--cc);box-shadow:0 0 14px color-mix(in srgb,var(--cc) 55%,transparent),inset 0 0 12px color-mix(in srgb,var(--cc) 25%,transparent);font-size:13px;font-weight:700;text-align:center;color:var(--cc);text-shadow:0 0 8px var(--cc);letter-spacing:.1em}
.chip b{display:block;height:3px;margin-top:5px;background:var(--cc);border-radius:2px;box-shadow:0 0 8px var(--cc);transform-origin:left}
.br{right:calc(16px + var(--sar));bottom:calc(16px + var(--sab))}
#btnPhase{pointer-events:auto;position:relative;width:clamp(76px,16vmin,104px);height:clamp(76px,16vmin,104px);border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 50% 40%,rgba(40,16,80,.85),rgba(10,4,30,.85));color:#fff;font-weight:800;font-size:clamp(14px,2.4vmin,18px);letter-spacing:.1em;
  box-shadow:0 0 18px rgba(25,230,255,.35);touch-action:none}
#btnPhase::before{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(var(--c2) calc(var(--p,0)*1turn),rgba(255,255,255,.14) 0);
  -webkit-mask:radial-gradient(circle,transparent calc(50% - 5px),#000 calc(50% - 4px));mask:radial-gradient(circle,transparent calc(50% - 5px),#000 calc(50% - 4px));
  filter:drop-shadow(0 0 6px var(--c2))}
#btnPhase.ready{animation:ready 1s ease-in-out infinite;box-shadow:0 0 28px var(--c2),inset 0 0 18px rgba(25,230,255,.5)}
#btnPhase span{position:relative;display:block;line-height:1.1}
#btnPhase small{display:block;font-size:10px;opacity:.7;letter-spacing:.15em;margin-top:2px}
#banner{left:50%;top:22%;transform:translate(-50%,0);font-size:clamp(22px,5.4vmin,48px);font-weight:900;font-style:italic;letter-spacing:.14em;text-align:center;white-space:nowrap;opacity:0;text-shadow:0 0 8px #fff,0 0 24px currentColor,0 0 48px currentColor}
#banner.show{animation:banner 1.7s ease-out forwards}
#hint{left:50%;bottom:calc(112px + var(--sab));transform:translateX(-50%);font-size:clamp(12px,2vmin,16px);color:#d9f7ff;text-shadow:0 0 10px var(--c2);letter-spacing:.1em;text-align:center;opacity:0;transition:opacity .6s;white-space:nowrap;padding:0 12px}
#hint.on{opacity:.95}
#popups{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-style:italic;font-size:clamp(15px,2.8vmin,24px);white-space:nowrap;letter-spacing:.06em;animation:floatup .95s ease-out forwards;text-shadow:0 0 6px currentColor,0 0 16px currentColor}
.pop.nm{color:#ffe45e;font-size:clamp(18px,3.4vmin,30px)}
.pop.orb{color:#6dfff0}
.pop.pw{color:#fff}
#topbtns{position:fixed;right:calc(12px + var(--sar));top:calc(12px + var(--sat));display:flex;gap:8px;z-index:8}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:12px;background:rgba(12,4,34,.6);border:1px solid rgba(25,230,255,.55);box-shadow:0 0 12px rgba(25,230,255,.3);display:grid;place-items:center;padding:0}
.ib:hover{background:rgba(40,16,90,.8)}
.ib svg{width:20px;height:20px;fill:#bff7ff;filter:drop-shadow(0 0 4px #19e6ff)}
#stick{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid rgba(25,230,255,.55);box-shadow:0 0 16px rgba(25,230,255,.4),inset 0 0 14px rgba(25,230,255,.2);pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}
#stick i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle,#fff,#19e6ff 60%,rgba(25,230,255,0));box-shadow:0 0 18px #19e6ff}
#stick.on{opacity:1}
#flashv{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(circle,rgba(255,40,80,0) 40%,rgba(255,40,80,.55));}
/* ---------- Panels ---------- */
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;
  background:linear-gradient(180deg,rgba(5,1,13,.35),rgba(5,1,13,.05) 60%,rgba(5,1,13,.4));}
#title{justify-content:flex-start;padding-top:max(2.5vh,12px)}
.panel.dim{background:rgba(5,1,13,.62);backdrop-filter:blur(3px)}
.card{padding:clamp(18px,3.5vmin,36px) clamp(22px,5vmin,52px);border-radius:20px;background:linear-gradient(160deg,rgba(26,8,60,.72),rgba(8,2,26,.78));border:1px solid rgba(255,43,214,.5);box-shadow:0 0 30px rgba(255,43,214,.25),0 0 60px rgba(25,230,255,.12),inset 0 0 30px rgba(120,40,255,.15);max-width:min(560px,94vw);max-height:96vh;overflow:auto;backdrop-filter:blur(4px)}
h1{margin:0;font-size:clamp(46px,11vmin,108px);font-weight:900;font-style:italic;line-height:1.05;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 15%,#ffd0f6 38%,#ff2bd6 62%,#7a2bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,43,214,.8)) drop-shadow(0 0 28px rgba(255,43,214,.55)) drop-shadow(0 4px 0 rgba(25,230,255,.55))}
.sub{margin-top:4px;font-size:clamp(16px,3.4vmin,30px);font-weight:800;letter-spacing:.55em;color:#aef4ff;text-shadow:0 0 10px #19e6ff,0 0 30px #19e6ff;padding-left:.55em}
.tag{margin:clamp(10px,2vmin,20px) 0 clamp(14px,3vmin,26px);font-size:clamp(13px,2.1vmin,17px);letter-spacing:.14em;color:#e7d8ff;opacity:.92}
.btn{display:inline-block;margin:6px;padding:.75em 2.1em;border-radius:999px;border:2px solid var(--c2);background:linear-gradient(180deg,rgba(25,230,255,.22),rgba(25,230,255,.06));color:#fff;font-size:clamp(16px,2.8vmin,22px);font-weight:800;letter-spacing:.22em;text-indent:.22em;
  box-shadow:0 0 18px rgba(25,230,255,.55),inset 0 0 16px rgba(25,230,255,.25);text-shadow:0 0 10px #19e6ff;transition:transform .12s,box-shadow .2s}
.btn:hover,.btn:focus-visible{transform:scale(1.06);box-shadow:0 0 32px rgba(25,230,255,.9),inset 0 0 20px rgba(25,230,255,.4);outline:none}
.btn:active{transform:scale(.97)}
.btn.main{border-color:var(--c1);background:linear-gradient(180deg,rgba(255,43,214,.32),rgba(255,43,214,.08));box-shadow:0 0 22px rgba(255,43,214,.7),inset 0 0 18px rgba(255,43,214,.3);text-shadow:0 0 10px #ff2bd6;animation:pulse 1.6s ease-in-out infinite}
.btn.sm{font-size:clamp(13px,2.2vmin,17px);padding:.6em 1.6em}
.kv{margin:clamp(12px,2.4vmin,22px) auto 0;display:grid;grid-template-columns:auto auto;gap:6px 18px;justify-content:center;font-size:clamp(12px,1.9vmin,15px);color:#d8e7ff;text-align:left}
.kv b{color:#fff;text-shadow:0 0 8px #19e6ff}
.kk{display:inline-block;min-width:1.7em;padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid rgba(25,230,255,.7);background:rgba(25,230,255,.1);text-align:center;font-size:.9em;color:#aef4ff}
.touch-only{display:none}
.legend{display:flex;gap:10px;justify-content:center;margin-top:clamp(10px,2vmin,18px);flex-wrap:wrap}
.legend span{font-size:clamp(11px,1.7vmin,14px);padding:3px 10px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);text-shadow:0 0 6px var(--cc);background:rgba(10,4,30,.5)}
.bigscore{font-size:clamp(46px,10vmin,88px);font-weight:900;font-style:italic;line-height:1.05;text-shadow:0 0 8px #fff,0 0 24px var(--c2),0 0 50px var(--c2);font-variant-numeric:tabular-nums}
h2{margin:0 0 6px;font-size:clamp(28px,6vmin,52px);font-weight:900;font-style:italic;letter-spacing:.14em;text-indent:.14em;color:#ff7be8;text-shadow:0 0 10px #ff2bd6,0 0 30px #ff2bd6}
#newrec{display:inline-block;margin:6px 0 2px;padding:3px 14px;border-radius:999px;background:linear-gradient(90deg,#ff9d00,#ffe45e);color:#2a1200;font-weight:900;letter-spacing:.2em;font-size:clamp(13px,2.2vmin,17px);box-shadow:0 0 22px #ffb400;animation:pulse 1s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px;margin:14px 0 8px;font-size:clamp(12px,2vmin,15px);color:#cfe0ff}
.stats div{display:flex;justify-content:space-between;gap:14px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.stats b{color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 8px #19e6ff}
#ovBest{color:#ffd1f5;font-size:clamp(13px,2.2vmin,17px);letter-spacing:.1em;margin-top:2px}
.credit{position:absolute;bottom:calc(10px + var(--sab));left:0;right:0;font-size:11px;color:rgba(200,190,255,.5);letter-spacing:.2em}
body.touch .touch-only{display:grid}
body.touch .kb-only,body.touch #btnPhase small{display:none}
@media (prefers-reduced-motion:reduce){.btn.main,#btnPhase.ready,#newrec{animation:none!important}}
@keyframes pulse{50%{transform:scale(1.045)}}
@keyframes ready{50%{box-shadow:0 0 40px var(--c2),inset 0 0 26px rgba(25,230,255,.7)}}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px) scale(1)}}
@media (max-width:640px){.chip{min-width:70px;font-size:12px;padding:5px 8px 7px}.bc{bottom:calc(110px + var(--sab));left:calc(16px + var(--sal));transform:none}#hint{bottom:calc(190px + var(--sab))}.stats{grid-template-columns:1fr}.btn{padding:.7em 1.6em}}
@media (max-height:480px){.card{padding:12px 22px}h1{font-size:44px}.tag{margin:6px 0 10px}.kv{margin-top:8px}.legend{display:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="flashv"></div>
<div id="stick"><i></i></div>
<div id="popups"></div>

<div id="hud" class="hidden">
  <div class="tl"><div class="lbl">分數</div><div id="score">0</div><div class="best">最高 <span id="hudBest">0</span></div></div>
  <div class="tc"><div id="comboBox"><span id="mult">×1</span><span id="comboTxt">連擊 0</span><div class="bar"><i id="comboBar"></i></div></div></div>
  <div class="bl"><div class="lbl">速度</div><span id="speed">0</span><span class="unit">km/h</span><div id="lvl">第 1 區</div></div>
  <div class="bc" id="powers"></div>
  <div class="br"><button id="btnPhase" aria-label="相位衝刺"><span>相位<small class="kb-only">空白鍵</small></span></button></div>
  <div id="banner"></div>
  <div id="hint"></div>
</div>

<div id="topbtns">
  <button class="ib hidden" id="btnPause" aria-label="暫停 (P)"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg></button>
  <button class="ib" id="btnMute" aria-label="靜音切換 (M)"><svg id="icoOn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="#bff7ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg id="icoOff" class="hidden" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#ff7be8" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
</div>

<div id="title" class="panel">
  <div class="card">
    <h1>霓虹疾航</h1>
    <div class="sub">NEON RUSH</div>
    <p class="tag">穿越發光隧道 · 閃避障礙 · 收集能量球</p>
    <button class="btn main" id="btnStart">開始遊戲</button>
    <div class="best" style="font-size:15px;margin-top:6px">最高紀錄　<b id="titleBest" style="font-size:20px;color:#fff">0</b></div>
    <div class="kv kb-only">
      <span><span class="kk">←</span><span class="kk">↑</span><span class="kk">↓</span><span class="kk">→</span> / <span class="kk">W</span><span class="kk">A</span><span class="kk">S</span><span class="kk">D</span></span><b>移動飛船</b>
      <span><span class="kk">空白鍵</span></span><b>相位衝刺（短暫無敵）</b>
      <span><span class="kk">P</span> / <span class="kk">Esc</span></span><b>暫停</b>
      <span><span class="kk">M</span></span><b>靜音切換</b>
    </div>
    <div class="kv touch-only">
      <span>拖曳螢幕</span><b>移動飛船</b>
      <span>點「相位」鈕</span><b>衝刺（短暫無敵）</b>
      <span>右上角按鈕</span><b>暫停 / 靜音</b>
    </div>
    <div class="legend">
      <span style="--cc:#5aa2ff">護盾：擋下一次撞擊</span><span style="--cc:#c27bff">慢動作：時間減速</span><span style="--cc:#b6ff3c">磁鐵：吸附能量球</span>
    </div>
  </div>
</div>

<div id="pause" class="panel dim hidden">
  <div class="card">
    <h2>暫停</h2>
    <p class="tag" style="margin:6px 0 14px">休息一下，準備好再出發</p>
    <div><button class="btn main" id="btnResume">繼續</button></div>
    <div><button class="btn sm" id="btnRestartP">重新開始</button><button class="btn sm" id="btnHomeP">回到標題</button></div>
  </div>
</div>

<div id="over" class="panel dim hidden">
  <div class="card">
    <h2>遊戲結束</h2>
    <div class="lbl" style="margin-top:8px">本次分數</div>
    <div class="bigscore" id="ovScore">0</div>
    <div id="newrec" class="hidden">★ 新紀錄！ ★</div>
    <div id="ovBest">最高紀錄 0</div>
    <div class="stats">
      <div>飛行距離<b id="stDist">0 m</b></div>
      <div>收集能量球<b id="stOrbs">0</b></div>
      <div>最大連擊<b id="stCombo">0</b></div>
      <div>擦身而過<b id="stNear">0</b></div>
    </div>
    <div><button class="btn main" id="btnAgain">再玩一次</button></div>
    <div><button class="btn sm" id="btnHomeO">回到標題</button></div>
  </div>
